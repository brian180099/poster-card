<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>포스터 카드</title>
    <script>
      // 첫 화면부터 저장된 테마를 적용해 밝은 화면이 깜빡이지 않게 합니다.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("poster-card-theme") === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
